<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPHA GUARD - 포트폴리오 감사 엔진</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { font-size: 24px; margin-bottom: 10px; color: #38bdf8; }
        p.subtitle { color: #94a3b8; margin-bottom: 30px; }
        .box { background: #0f172a; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #334155; }
        textarea { width: 100%; height: 100px; background: #1e293b; color: #fff; border: 1px solid #475569; padding: 12px; border-radius: 6px; font-size: 14px; resize: vertical; box-sizing: border-box; }
        button { background: #0284c7; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        button:hover { background: #0369a1; }
        #status { margin-top: 15px; font-size: 14px; color: #cbd5e1; }
        .result-box { margin-top: 20px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ALPHA GUARD</h1>
        <p class="subtitle">엄정한 독립 Premise 검증 및 포트폴리오 감사 시스템</p>
        
        <div class="box">
            <label for="claimInput"><strong>검증할 주장 입력</strong></label>
            <p style="font-size: 12px; color: #94a3b8; margin: 5px 0 10px 0;">예: "삼성전자와 TQQQ를 5:5로 담으면 연평균 수익률이 20%가 넘는다"</p>
            <textarea id="claimInput" placeholder="포트폴리오 구성 및 주장을 입력하세요..."></textarea>
            <button onclick="runAudit()">감사 실행</button>
            <div id="status">데이터 로딩 중...</div>
        </div>

        <div class="box result-box" id="resultArea">
            <h3>감사 결과 보고서</h3>
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        let marketData = null;

        // 알파가드 v3 데이터셋 로드 (경로 변경 완료)
        fetch('alphaguard_data_v3.json')
            .then(res => res.json())
            .then(data => {
                marketData = data;
                document.getElementById('status').innerText = `데이터 로드 완료: 총 자산 ${Object.keys(data.assets).length}종 (${data.dates[0]} ~ ${data.dates[data.dates.length-1]})`;
            })
            .catch(err => {
                document.getElementById('status').innerText = '데이터 로드 실패: alphaguard_data_v3.json 파일을 확인하세요.';
                console.error(err);
            });

        function runAudit() {
            if (!marketData) {
                alert('데이터가 아직 로드되지 않았습니다.');
                return;
            }
            const text = document.getElementById('claimInput').value;
            const resultArea = document.getElementById('resultArea');
            const resultContent = document.getElementById('resultContent');
            
            resultArea.style.display = 'block';
            resultContent.innerHTML = `<p>입력된 주장("${text}")에 대한 독립 검증을 수행 중입니다...</p><p style="color: #38bdf8;">현재 117종의 자산 데이터베이스를 기반으로 시뮬레이션을 구동하고 있습니다.</p>`;
        }
    </script>
</body>
</html>
